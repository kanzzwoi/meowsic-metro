name: Release (foss + izzy)

# Rilis resmi bertanda tangan release key, pakai applicationId rilis
# (id.meowku.meowsic) supaya bisa menimpa instalasi 0.6.6 yang sudah ada.
# Varian gms dilewati: dependensi Cast (media3-cast 1.10.1 / mediarouter 1.8.1 /
# play-services-cast 22.3.1) tidak bisa di-resolve saat ini.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
            variantName: Foss
            assetName: meowsic.apk
          - variant: izzy
            variantName: Izzy
            assetName: meowsic-izzy.apk

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: id.meowku.meowsic
          METROLIST_APP_NAME: Meowsic
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Rename signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            ls -la "$OUTPUT_DIR"
            exit 1
          fi
          mv "$SIGNED_APK" "$OUTPUT_DIR/out/${{ matrix.assetName }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: meowsic-${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  publish:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Collect APKs
        run: |
          mkdir -p release_files
          find downloaded -name "*.apk" -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Releasing v$VERSION"
          {
            echo "APK resmi (release key), applicationId id.meowku.meowsic."
            echo ""
            echo "- Lirik KuGou (per kata) disimpan permanen"
            echo "- Terjemahan lirik tidak hilang saat keluar-masuk pemutar"
            echo "- Label lirik hanya nama provider"
            echo "- Tab library: ikon baru + label 'library'"
            echo "- Tata letak Dengar Bersama dirapikan"
            echo "- Log pemutaran dipangkas otomatis (128 KB)"
            echo "- Auto-reconnect service hanya saat app di depan"
            echo ""
            echo "Varian gms (Google Cast) tidak disertakan pada rilis ini."
          } > notes.md
          gh release view "v$VERSION" >/dev/null 2>&1 \
            && gh release upload "v$VERSION" release_files/*.apk --clobber \
            || gh release create "v$VERSION" --title "$VERSION" --notes-file notes.md --latest release_files/*.apk
